[package]
name = "tuack-plugin-sdk"
description = "tuack-ng 插件 Rust SDK"
edition.workspace = true
version = "2.0.0"
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["tuack-ng", "plugin", "wasm", "extism"]
categories = ["wasm", "development-tools"]
rust-version.workspace = true

[dependencies]
tuack-lib = { version = "1.1.0-alpha.2", path = "../tuack-lib" }
tuack-ng-parser = { workspace = true, features = ["serde"] }

log.workspace = true

extism-pdk = { version = "1.4.1", default-features = false }
